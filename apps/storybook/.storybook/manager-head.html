<!--
  Fonts for Storybook's own interface (sidebar, toolbar). It runs outside the story iframe, so the
  @fontsource imports in preview.ts don't reach it. The files are served by the staticDirs in main.ts.
-->
<link rel="icon" type="image/svg+xml" href="./logo/logo-brand.svg" />

<style>
  @font-face {
    font-family: 'Overlock';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/overlock/overlock-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Overlock';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('./fonts/overlock/overlock-latin-700-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Parkinsans';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/parkinsans/parkinsans-latin-400-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Parkinsans';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('./fonts/parkinsans/parkinsans-latin-700-normal.woff2') format('woff2');
  }

  /* Sidebar group headings in the label font, like KalaDS overlines. */
  .sidebar-subheading {
    font-family: 'Parkinsans', sans-serif;
  }
</style>

<script>
  // Storybook's viewport tag sets maximum-scale=1, which stops people zooming on touch devices (WCAG 1.4.4).
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('meta[name="viewport"]')?.setAttribute('content', 'width=device-width, initial-scale=1');
  });
</script>
